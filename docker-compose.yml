services:
  postgres:
    image: postgres:16
    container_name: financebot_postgres

    environment:
      POSTGRES_USER: hizfanno_finance
      POSTGRES_PASSWORD: hizfannofinance123
      POSTGRES_DB: finance_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: financebot_api


    env_file:
      - .env

    depends_on:
      - postgres

    command: python bot_runner.py

volumes:
  postgres_data: