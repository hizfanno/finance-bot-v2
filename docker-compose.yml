services:
  postgres:
    image: postgres:16
    container_name: financebot_postgres
    environment:
      POSTGRES_USER: hizfanno_finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hizfanno_finance -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: financebot_api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy   # tunggu Postgres benar-benar siap
    command: python bot_runner.py

volumes:
  postgres_data: